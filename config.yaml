# Tunable pipeline settings. Secrets are NOT here (they live in env / GitHub Actions secrets).

# Dedupe ledger DIRECTORY (one CSV per company, kept small for diffing). Override
# per-machine with LEDGER_DIR so a local run keeps a separate "seen" list from the
# committed cloud ledger (cloud_data/ on the data branch).
ledger_dir: "local_data"

# OpenAI model used for scoring.
model: "gpt-5.6"

# Reasoning effort for reasoning models (gpt-5.6): none | low | medium | high | xhigh.
# "mid" = medium. Leave blank ("") for non-reasoning models (e.g. gpt-4o-mini).
reasoning_effort: "medium"

# Fallback when no OPENAI_API_KEY: a local GPT CLI to drive (authed via a ChatGPT
# login). gpt_cli is the executable (override per-machine with the GPT_CLI env var,
# e.g. a full path with spaces); gpt_cli_args are the args before the prompt, which
# is appended last. If gpt_cli isn't found, scoring drops to keyword-only.
# `-c model=gpt-5.6-luna` pins codex's fast/cheap tier for this rating task, overriding
# whatever model codex's own config.toml defaults to; `-c model_reasoning_effort=low`
# likewise overrides its reasoning default (e.g. xhigh) — a simple rating doesn't need
# more, and low is far faster/cheaper.
# Senior-group roles (see senior_terms) are dropped before scoring (unless a referral
# company claims them first), so they never reach this scorer — wired in __main__.
gpt_cli: "codex"
gpt_cli_args: ["exec", "-c", "model=gpt-5.6-luna", "-c", "model_reasoning_effort=low"]

# Truncate each job description to this many characters before sending to the LLM.
max_description_chars: 8000

# How many jobs to score concurrently (1 = sequential). Higher clears a backlog faster,
# but the CLI path (codex exec) spawns one heavy subprocess per worker, and all workers
# share your ChatGPT rate limit — raise cautiously.
score_workers: 5

# HTTP behaviour for the ATS fetchers.
request_timeout: 20
user_agent: "job-scout/1.0 (+https://github.com/)"

# Polite random delay (seconds) before every request, applied centrally in HttpClient;
# jitter avoids a fixed cadence that looks like a bot.
request_delay_min: 1.25
request_delay_max: 2.0

# Each new role is routed to the FIRST track whose keyword hit count reaches its
# `min_hits` (a hit = one occurrence of a keyword in the title or description; the
# SAME keyword occurring N times counts as N hits). Order matters — list the more
# specific track first. Each track is its own email section, titled by `name`.
# Two gates, one per ScoreScale, since the scorers' outputs aren't comparable: a role
# is emailed only when its experience_score exceeds the gate for the scale that
# produced it.
#   llm_threshold     - OpenAI/CLI scorers: resume-vs-role fit, 0-100.
#   keyword_threshold - keyword fallback: 40 + 3 * distinct skill_keywords matched
#     (never leaves 40-100; 50 means "4 hits", not "half a fit"). Set equal to
#     llm_threshold below for now, but tune independently.
# Both keys are required — the old shared `threshold` key raises at load.
#
# `word_keywords` (optional) match WHOLE-WORD against the TITLE only, and add to the
# same hit count. Use them for tokens that are unsafe as substrings ("ai" hits
# "email"/"training") or that appear in nearly every JD body ("engineer" — matching
# descriptions would route almost everything). A trailing plural "s" is absorbed.
#
# Routing doubles as ADMISSION: a role hitting no track is dropped before scoring.
# The last track ("Other Technical") is a deliberately broad catch-all for exactly
# that reason — see its comment below for the concrete examples.
tracks:
  - name: "Computer Vision"
    llm_threshold: 50
    keyword_threshold: 50
    min_hits: 1
    keywords:
      - "computer vision"
      - "image"
      - "video"
      - "segmentation"
      - "object detection"
      - "perception"
      - "slam"
      - "point cloud"
      - "ocr"
      - "3d"
      - "visual"
  # AI/ML before Software Engineering: a role matching both lands in the AI/ML email.
  - name: "AI / ML"
    llm_threshold: 50
    keyword_threshold: 50
    min_hits: 1
    keywords:
      - "machine learning"
      - "deep learning"
      - "artificial intelligence"
      - "ml engineer"
      - "ai engineer"
      - "genai"
      - "generative ai"
      - "llm"
      - "nlp"
      - "neural network"
      - "mlops"
      - "reinforcement learning"
      - "recommendation system"
      - "data scientist"
      - "data science" # NOT covered by "data scientist" (scienti- vs science): "Data Science Intern" titles
    word_keywords:
      - "ai" # whole-word + title-only: substring would hit "email"/"training"
  - name: "Software Engineering"
    llm_threshold: 50
    keyword_threshold: 50
    min_hits: 1
    keywords:
      - "software engineer"
      - "software developer"
      - "software development engineer" # Amazon/Adobe "SDE" spelled out; bare "sde" is a word_keyword on Other Technical
      - "backend engineer"
      - "frontend engineer"
      - "full stack"
      - "full-stack"
      - "distributed systems"
      - "data engineer"
      - "platform engineer"
      - "infrastructure engineer"
      - "devops"
      - "site reliability"
      # QA / software-test roles are targets (the resume's automated-testing background);
      # note exclude_terms deliberately does NOT list "test engineer" for the same reason.
      - "test engineer" # substring also covers "Software Test Engineer"
      - "sdet"
      - "qa engineer"
  # < !-- PM / TPM track is commented out, but kept on purpose (user decision 2026-08-05) -->
  # # PM roles are kept on purpose (user decision 2026-08-05): they route here instead of
  # # dying at admission. Below the engineering tracks, so a domain-worded PM title
  # # ("Technical Program Manager, GenAI…") lands in its domain track first. The LLM scores
  # # PM fit against an engineering resume, so expect low scores — roles this threshold
  # # kills are accepted losses.
  # - name: "PM / TPM"
  #   llm_threshold: 50
  #   keyword_threshold: 50
  #   min_hits: 1
  #   keywords:
  #     - "product manager"
  #     - "product management"
  #     - "program manager" # substring also covers "Technical Program Manager"
  #     - "project manager"
  #     - "product owner"
  # Catch-all admission net, ALWAYS LAST: technical roles whose titles carry no domain
  # word (Amazon "Software Development Engineer, Bottlerocket", Oracle "Software
  # Developer 3", Honeywell "Software Engr II") reach the scorer instead of being
  # dropped unseen. word_keywords are title-only, so "engineer" in a JD body does NOT
  # admit a role — pharmacy/retail/ops titles still die at admission.
  - name: "Other Technical"
    llm_threshold: 50
    keyword_threshold: 50
    min_hits: 1
    keywords:
      - "research assistant" # kept per user decision 2026-08-05; the scorer judges field fit
    word_keywords:
      - "engineer"
      - "engr"
      - "developer"
      - "scientist"
      - "software"
      - "programmer"
      - "sde"
      - "researcher"
      - "sciences" # "Research Sciences Intern"; NOT "research" — it admits astronomy RAs / equity research

# Drop unwanted roles before any scoring (any tier): non-technical OR too-senior. Matched as a
# lowercase substring in the title OR the department — so e.g. department "Sales"
# is excluded too.
exclude_terms:
  # too senior for an intern / new-grad applicant (title substring). Note: bare "vp"
  # is intentionally NOT listed — it would substring-match "vpc"/"vpn" tech roles.
  - "director"
  - "principal"
  - "staff"
  - "lead" # safe as substring: its matches (lead/leader/leadership/leading) are all senior
  - "vice president"
  - "head of " # "Head of X" senior roles; trailing space avoids "head office". NOT bare "head" — even whole-word it hits CV terms (head pose/detection/tracking, head-mounted)
  # requires an advanced degree — both "PhD" and "Ph.D." spellings (substring, lowercased)
  - "phd"
  - "ph.d"
  - "postdoc" # stem also matches "postdoctoral" (researcher/fellow/scholar)
  # technical / scientific fields outside the user's target (CV / AI-ML / SWE). "physics"
  # won't substring-match "physical"; "gpu" has no common English-word collisions.
  - "physics"
  - "chemistry" # won't match "chemical" (different stem)
  - "drug" # pharma / drug-discovery domain
  - "environmental" # environmental science / sustainability field
  - "mechanical" # different engineering discipline (also matches "electromechanical")
  - "electrical"
  - "firmware"
  - "microelectronics"
  - "micro-electronics" # hyphen spelling of the above
  - "wire bond" # semiconductor packaging; also matches "wire bonding" / "wire bonder"
  # Hardware/silicon & manufacturing wave (added 2026-08-04, mined from score-gate drops).
  # KNOWN COST for "hardware": dept match also drops SWE roles inside hardware orgs
  # (e.g. Intel "AI Software Engineering Intern" under a Hardware dept).
  - "hardware"
  - "silicon"
  - "analog"
  - "mixed signal"
  - "mixed-signal" # hyphen spelling of the above
  - "fpga"
  - "thermal" # KNOWN edge: would also drop thermal-imaging CV roles (none seen in ledger)
  - "packaging" # physical + semiconductor packaging roles
  # NOT "test engineer": it would also drop QA / software-test roles (kept as targets).
  # NOT bare "manufacturing" (replaced 2026-08-05, measured over the whole ledger): as a DOMAIN
  # word it uniquely killed ~30 real SWE roles ("… Software Engineer, Manufacturing …" at SpaceX/
  # Figure/Zoox/Google/KLA/TSMC/Ouster) while adding nothing — the 1030 factory-floor titles it
  # caught all fail track routing anyway. The phrases below instead anchor on manufacturing as the
  # ROLE. KNOWN cost: "manufacturing engineer" also substring-matches the DEPARTMENT
  # "Manufacturing : Manufacturing Engineering", so Anduril's 3 Manufacturing-SWE roles still drop
  # (ITAR-bound regardless). Deliberately absent: "manufacturing test" / "…systems" / "…software"
  # (all real SWE titles), and "manufacturing test engineer" (sounds SWE-ish, and every such title
  # already fails track routing, so the phrase bought nothing).
  - "manufacturing engineer" # substring also covers "Manufacturing Engineering" (447 ledger rows)
  - "manufacturing equipment" # equipment-maintenance technician titles
  - "manufacturing operations"
  - "manufacturing operator"
  - "manufacturing quality"
  - "manufacturing specialist"
  - "manufacturing supervisor"
  - "manufacturing manager"
  # NOT bare "industrial": it dept-matches "Industrial Robotics" (an emailed Amazon Applied
  # Scientist intern was in that org) — only the design discipline is excluded.
  - "industrial design"
  - "technician"
  - "network"
  - "cybersecurity"
  - "cyber security" # separate entry: substring won't unify it with the one-word spelling
  - "data center" # infra / facilities ops
  - "datacenter" # one-word spelling of the above
  - "gpu" # usually is related to CUDA or kernel
  - "cpu"
  - "kernel" # low-level OS / GPU-kernel systems roles, outside the CV/AI-ML/SWE target
  # non-technical functions
  - "marketing"
  - "sales"
  - "customer"
  # AI-flavored advisory/strategy wave (added 2026-08-05, mined from admission-gate leaks:
  # "Advisory AI Strategist", "Enterprise AI Strategy Consultant", "AI Apprentice").
  # NOT "consulting": it kills Cisco "Technical Consulting Engineer" (real SWE roles).
  # NOT bare "architect" here: substring hits "Architecture" in real SWE titles/depts —
  # it lives in exclude_word_terms instead.
  - "strategist"
  - "strategy"
  - "consultant"
  - "apprentice"
  - "recruit"
  - "recruiter"
  - "account executive"
  - "designer"
  - "artist" # 3D / concept / technical / VFX artist
  - "animator"
  - "finance"
  - "banking"
  - "legal"
  - "policy" # public-policy / policy-analyst roles
  - "talent"
  - "brand"
  - "social media"
  - "community"
  - "business" # broad: subsumes "business development"; also drops "Business Intelligence/Analyst" titles
  - "supply" # subsumes "supply chain"; also supplier / procurement / power-supply roles
  - "buyer"
  - "merchandising"
  - "people partner"
  - "operations manager"
  # NOT bare "financial": fintech dept names (Affirm) carry it on real backend-SWE rows.
  - "financial analyst"
  - "human resources"
  - "government affairs"
  # Trailing space is deliberate: matches "partner <role>" (e.g. partner marketing/solutions)
  # but NOT "partnership(s)".
  - "partner "

# Rank-free title idioms BLANKED from title/department before exclude_terms /
# exclude_word_terms run (whole-phrase, case-insensitive). "Member of Technical Staff"
# is a rank-free everyone-title at AI labs (new grads included), so exclude_terms'
# "staff" (meant for Staff-Engineer seniority) must not see it. Only the phrase is
# blanked — seniority words AROUND it still act: "Principal Member of Technical Staff"
# still drops on "principal"; "Senior MTS" still lands in the suppressed Senior group. (2026-08-05)
exempt_role_phrases:
  - "member of technical staff"
  - "member of the technical staff" # OpenAI-style spelling with "the"

# Highest-priority filter: drop a job if its DEPARTMENT contains any of these
# (lowercase substring). Checked before every other rule.
exclude_dept_terms:
  - "audit"
  - "sales"
  - "commercial"
  - "market"
  - "customer"

# Whole-word exclusions (\b...\b), matched against title OR department. Use this list
# (not exclude_terms) for any token short enough to be an unsafe substring: e.g. "ux"
# drops "UX Designer/Researcher" but not "Linux"/"flux"/"redux"/"auxiliary".
exclude_word_terms:
  - "ux"
  - "tpu" # whole-word: bare "tpu" would substring-hit "output"
  - "hr" # whole-word: substring would hit "Chrome"/"HRT"; catches "HR Project Manager" & dept "HR"
  - "asic" # whole-word: substring would hit "Basic"
  - "rtl" # whole-word: substring would hit "Myrtle"; RTL/chip-design roles
  # Architect roles are 10+-yrs-senior; whole-word so "architecture" survives (substring
  # would kill "AI Infrastructure Engineer Intern (TikTok Recommendation Architecture)").
  - "architect"

# Drop a job when its DESCRIPTION contains any of these (lowercase substring; the text is
# whitespace-collapsed and curly apostrophes straightened before matching, so a phrase still
# hits across the line breaks strip_html leaves). Purpose: the formulaic "no visa/immigration
# sponsorship" legal boilerplate. CAVEAT: most listings reach this check title-only, because
# their listing API omits the body (Workday/BambooHR entirely, Oracle a short blurb) — those
# roles can't be caught here (the LLM sees the same text, so it couldn't either). EXCEPTION:
# a NEW PreFilter survivor whose JD URL JdUrlEnricher can resolve gets re-checked against
# these terms with its real description (see pipeline._enrich_and_refilter) — that second
# pass is what makes the citizenship/clearance rows below reach defense-prime Workday JDs.
# Substring redundancy is deliberate: "does not offer VISA sponsorship"
# does NOT contain "not offer sponsorship", so the visa/immigration middles get their own rows.
exclude_description_terms:
  # broadest anchor: covers "will/do/does/can/cannot/may not sponsor" and "not sponsorship-eligible"
  - "not sponsor"
  - "won't sponsor"
  - "no visa sponsorship"
  - "no immigration sponsorship"
  - "no sponsorship" # "no sponsorship (is) available / offered / provided"
  - "unable to sponsor"
  - "not able to sponsor"
  # "does not offer/provide/support [visa|immigration] sponsorship"
  - "not offer sponsorship"
  - "not offer visa sponsorship"
  - "not offer immigration sponsorship"
  - "not provide sponsorship"
  - "not provide visa sponsorship"
  - "not provide immigration sponsorship"
  - "not support sponsorship"
  - "not support visa sponsorship"
  - "unable to provide sponsorship"
  - "unable to provide visa sponsorship"
  - "unable to offer sponsorship"
  - "unable to offer visa sponsorship"
  - "sponsorship is not available"
  - "sponsorship not available"
  - "sponsorship is unavailable"
  # "(not eligible|ineligible) for … sponsorship" moved to exclude_description_patterns
  # below (needs a regex wildcard for employers naming themselves mid-phrase).
  # US-citizenship / security-clearance requirements — a visa candidate can't meet these
  - "security clearance"
  - "ts/sci"            # postings that write "TS/SCI clearance" without the word "security"
  - "be a us citizen"   # requirement phrasing ("candidate selected be a US Citizen"; "must be a US citizen")
  - "be a u.s. citizen" # same, period spelling (normalizer keeps the dots)

# Same purpose and same haystack as exclude_description_terms, but each row is a RAW REGEX
# (case-insensitive, NOT escaped) — use this only where a fixed substring cannot express the
# match. Backslashes survive as written under YAML single quotes; double quotes would not.
exclude_description_patterns:
  # Covers "not eligible for <EMPLOYER> sponsorship" (Intel, Qualcomm etc. name themselves
  # mid-phrase, defeating any substring list) plus the plain "(not eligible|ineligible) for
  # [visa|immigration] sponsorship" spellings.
  # Gap class excludes sentence punctuation on purpose: without it, "not eligible for
  # overtime. Visa sponsorship is available" would match and wrongly drop a job that DOES sponsor.
  - '\b(?:not eligible|ineligible) for (?:[^\s.,;:!?]+ ){0,3}sponsorship'
  # US-citizenship requirements, which none of the fixed substrings above match: RTX writes
  # "U.S. citizenship is required, as only U.S. citizens are authorized to access information
  # under this program/contract."; GDIT writes "US citizenship required" -- neither carries
  # the "be a" that exclude_description_terms' "be a us citizen" needs. Optional dots cover
  # both the "U.S." and "US" spellings (_normalize_prose keeps the dots).
  # Anchored on the requirement's VALUE, never on RTX's section header "U.S. Citizen, U.S.
  # Person, or Immigration Status Requirements:" -- that header is stamped into EVERY RTX
  # posting, including ones whose value is "None", so matching it would drop the whole board.
  - 'u\.?s\.? citizenship (?:is )?(?:a )?(?:required|requirement)'
  - 'only u\.?s\.? citizens'

# AMBIGUOUS eligibility wording: usually restrictive, but NOT a guaranteed disqualifier — so a
# match does NOT drop the job; it is still scored and emailed with a "possibly NO visa sponsorship
# — description says <term>" caveat line. Same matching semantics as exclude_description_terms
# above. Two families:
#  (1) sponsorship phrasing that describes the CANDIDATE ("must not require sponsorship",
#      "authorized to work without sponsorship") rather than stating outright "we don't sponsor";
#  (2) ITAR / export-control mentions (SpaceX, Anduril, defense primes): often — but NOT always —
#      a hard US-person requirement, since an EAR/dual-use role, or a company able to obtain an
#      export license, may still take a visa holder. NOTE: bare "itar" is intentionally omitted —
#      as a substring it hits "military" (mil-ITAR-y), common in these very defense JDs; anchor on
#      the surrounding phrases instead.
warn_description_terms:
  - "not require sponsorship" # "must not require sponsorship now or in the future"
  - "without sponsorship"     # "authorized to work ... without sponsorship"
  - "without the need for sponsorship"
  - "without the need for visa sponsorship"
  - "international traffic in arms"  # ITAR spelled out, e.g. "...Regulations (ITAR)"
  - "export control"                 # "export control laws/regulations"; also catches "export controls"/"export controlled" (space form)
  - "export-controlled"              # hyphen spelling the space term above misses
  - "export regulations"             # SpaceX phrasing: "U.S. Government export regulations"

# The candidate's real technical skills, used ONLY by the keyword-only scorer (the
# fallback when no OpenAI key / GPT CLI is available — e.g. cloud runs). Scores DISTINCT
# terms matched in the title+description, so keep this to meaningful skills, not resume
# filler. Matching is boundary-aware and case-insensitive:
# short/symbol tokens are safe ("go" won't hit "google", "ai" won't hit "email", "c++"
# matches literally) and a trailing plural "s" is absorbed ("api" hits "APIs"), but it
# does NOT stem — list "go" and "golang" (or "scikit-learn" and "sklearn") separately if
# a JD may use either. Purely additive: editing this never affects routing or filtering.
# Title-only listings (many list APIs return no description) weigh each distinct hit
# higher (2 distinct clear a 50 threshold instead of 4); referral/intern title-only
# roles skip the keyword gate entirely and are always emailed (see __main__ wiring).
skill_keywords:
  # Programming languages
  - "python"
  - "c++"
  - "c#"
  - "java"
  - "go"
  - "golang"
  - "matlab"
  - "lua"
  - "bash"
  # ML / CV frameworks & libraries
  - "pytorch"
  - "tensorflow"
  - "keras"
  - "tensorboard"
  - "opencv"
  - "onnx"
  - "numpy"
  - "pandas"
  - "scikit-learn"
  - "sklearn"
  # ML / CV models & concepts (singular form; the "s?" match covers plurals)
  - "computer vision"
  - "machine learning"
  - "ml"
  - "deep learning"
  - "reinforcement learning"
  - "rl"
  - "neural network"
  - "cnn"
  - "artificial intelligence"
  - "ai"
  - "yolo"
  - "transformer"
  - "transfer learning"
  - "capsnet"
  - "stardist"
  - "object detection"
  - "segmentation"
  - "image"
  - "3d"
  - "data augmentation"
  # Testing / QA. Every number here is MEASURED: 6154 real JDs from 32 Greenhouse boards,
  # annotated "sw/hw/eng" = hit rate in software-test titles (n=41) / hardware-test titles
  # (n=27) / other engineering titles (n=2177). Regenerate before editing this block.
  # Grouped by concept family, NOT by hit rate, so spellings of one idea stay adjacent
  # ("automated test" cannot be found by looking near "automated testing" otherwise).
  # STRATIFY software vs hardware test when re-measuring. Nearly half of all test-titled
  # roles are hardware test (Flight Test Operator, Cell Test Engineer, Environmental Test
  # Technician), and pooling them hides which way a term points: "instrumentation" looked
  # strong pooled but is 15/44/2 — it means DAQ and oscilloscopes, the wrong role — and was
  # cut with "test result" (7/26/1) for the same reason.
  # Two traps met while tuning this list:
  #  - A high hit rate is not enough. "root cause" (29/33/4) and "defect" (15/0/1) were cut
  #    after measuring that removing them left the test-JD pass rate unchanged: every JD
  #    they hit already cleared the gate on other terms, so they only inflated scores.
  #  - "Too generic-sounding" is not grounds to cut. Dropping "validation"+"verification"
  #    collapses test-JD pass 86.8% -> 70.6% (pooled measurement); they carry this block
  #    while the precise QA phrases barely occur. Terms with no individual effect still
  #    carry weight collectively (cutting 20 at once cost 7.4pp), so measure the exact set
  #    you intend to cut, never one term at a time. That is also why the many sub-10%
  #    terms below stay: ~0% in the 2177 non-test JDs, so they cost no precision, and the
  #    agency and Taiwan QA postings this scanner also crawls name tools far more than
  #    these US boards do (ATS guides claim Selenium is in >85% of QA ads; here it is 5%).
  # Absent on purpose: "manual testing" (boosts explicitly-manual roles), bare "coverage"
  # (benefits sections say "insurance coverage"), "debugging" (27/19/15), "ci/cd" (20/0/15)
  # and "end-to-end" (37/52/27) (every SWE JD says them), "unit test" (0/0/1, said only by
  # non-test JDs), and narrower forms of a term already here ("test automation", "qa
  # automation") — the word boundary lets "automation"/"qa" match inside those, so adding
  # them would only reweight, never add reach.
  # automation
  - "automation"                 # 73/59/28
  - "automated test"             # 27/33/1 — "s?" covers "automated tests" only
  - "automated testing"          # 7/4/3 — no stemming, so the -ing form is its own entry
  # validation & verification
  - "validation"                 # 63/67/14 — ML JDs mean "validation set"; load-bearing, keep
  - "verification"               # 22/19/6
  # quality / QA
  - "qa"                         # 34/0/10 — with "quality assurance", the cleanest sw marker
  - "quality assurance"          # 24/0/1
  - "quality engineering"        # 7/0/1
  # the discipline and its titles
  - "test engineering"           # 22/26/1
  - "test development"           # 7/0/0
  - "sdet"                       # 7/0/0
  - "istqb"                      # 5/0/0
  # test artifacts and process
  - "test plan"                  # 34/30/2
  - "test case"                  # 17/7/1
  - "test coverage"              # 17/0/1
  - "test strategy"              # 15/19/0
  - "test execution"             # 12/22/0 — hw-leaning, but zero cost outside test roles
  - "test data"                  # 12/15/1
  - "test failure"               # 12/0/0
  - "test infrastructure"        # 10/11/1
  - "test environment"           # 5/4/0
  # harnesses
  - "test suite"                 # 7/0/0
  - "test framework"             # 5/4/1
  - "test script"                # 2/7/0
  # kinds of testing
  - "integration testing"        # 12/0/1
  - "e2e"                        # 10/0/0
  - "regression testing"         # 5/4/0
  - "regression test"            # 2/7/0 — not covered by "regression testing" (test vs testing)
  - "api testing"                # 5/0/0
  - "load testing"               # 5/0/0
  - "performance testing"        # 2/7/0
  # tools, by platform
  - "jenkins"                    # 10/0/2
  - "selenium"                   # 5/0/0 — moved here from the ML/CV block, where it never belonged
  - "playwright"                 # 7/0/1
  - "cypress"                    # 2/0/0
  - "pytest"                     # 5/0/0
  - "junit"                      # 0/0/0
  - "postman"                    # 5/0/0
  - "jmeter"                     # 2/0/0
  - "appium"                     # 0/0/0
